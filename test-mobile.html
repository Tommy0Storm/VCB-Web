<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>VCB Mobile Test</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .grid-test { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-test { padding: 15px; background: #f5f5f5; border-radius: 8px; }
        @media (max-width: 768px) {
            .grid-test { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>VCB Mobile Test Page</h1>
    
    <div class="test-section">
        <h2>Layout Test</h2>
        <p>This page tests if mobile fixes are working correctly.</p>
        
        <div class="grid-test">
            <div class="card-test">Card 1</div>
            <div class="card-test">Card 2</div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Viewport Info</h2>
        <p>Screen width: <span id="width"></span>px</p>
        <p>Is mobile: <span id="mobile"></span></p>
    </div>
    
    <script>
        function updateInfo() {
            document.getElementById('width').textContent = window.innerWidth;
            document.getElementById('mobile').textContent = window.innerWidth <= 768 ? 'Yes' : 'No';
        }
        updateInfo();
        window.addEventListener('resize', updateInfo);
    </script>
    
    <script src="fix-mobile.js"></script>
</body>
</html>
