<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50">
  <!-- Modern Monochrome Shield with Scale - White Version -->
  <g transform="translate(2, 2)">
    <!-- Shield Background -->
    <path d="M20 2 L38 8 L38 26 C38 36 20 46 20 46 C20 46 2 36 2 26 L2 8 Z" 
          fill="white" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    
    <!-- Inner Shield Highlight -->
    <path d="M20 6 L34 11 L34 25 C34 33 20 41 20 41 C20 41 6 33 6 25 L6 11 Z" 
          fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" opacity="0.5"/>
    
    <!-- Balanced Scale Icon -->
    <g transform="translate(20, 24)" fill="#0a0a0a">
      <!-- Central Pillar -->
      <rect x="-1.5" y="-8" width="3" height="16" rx="0.5"/>
      <!-- Balance Beam -->
      <rect x="-12" y="-10" width="24" height="2.5" rx="1"/>
      <!-- Left Scale Plate -->
      <circle cx="-10" cy="-6" r="1.2"/>
      <line x1="-10" y1="-9" x2="-10" y2="-6" stroke="#0a0a0a" stroke-width="1"/>
      <ellipse cx="-10" cy="2" rx="5" ry="1.8" opacity="0.9"/>
      <line x1="-10" y1="-6" x2="-14" y2="1" stroke="#0a0a0a" stroke-width="0.8"/>
      <line x1="-10" y1="-6" x2="-6" y2="1" stroke="#0a0a0a" stroke-width="0.8"/>
      <!-- Right Scale Plate -->
      <circle cx="10" cy="-6" r="1.2"/>
      <line x1="10" y1="-9" x2="10" y2="-6" stroke="#0a0a0a" stroke-width="1"/>
      <ellipse cx="10" cy="2" rx="5" ry="1.8" opacity="0.9"/>
      <line x1="10" y1="-6" x2="6" y2="1" stroke="#0a0a0a" stroke-width="0.8"/>
      <line x1="10" y1="-6" x2="14" y2="1" stroke="#0a0a0a" stroke-width="0.8"/>
      <!-- Base -->
      <path d="M-4 8 L4 8 L3 10 L-3 10 Z" opacity="0.9"/>
    </g>
  </g>
  
  <!-- #ProjectDarkMatter Text - White Version -->
  <text x="48" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)">#Project</text>
  <text x="48" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white">Dark</text>
  <text x="110" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.9)">Matter</text>
  
  <!-- Tagline -->
  <text x="195" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="500" fill="rgba(255,255,255,0.6)">The Nr 1 SA</text>
  <text x="195" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="500" fill="rgba(255,255,255,0.6)">Legal Intelligence</text>
</svg>
