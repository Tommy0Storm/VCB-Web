<?xml version="1.0" encoding="UTF-8"?>
<!--
  ╔═══════════════════════════════════════════════════════════════════════════╗
  ║  GOGGA CHAT APP - ICON CREATION SPINNER                                   ║
  ║  For quick icon generation (~2-3 seconds)                                 ║
  ╠═══════════════════════════════════════════════════════════════════════════╣
  ║                                                                           ║
  ║  🔷 CONCEPT: App icon grid morphing into existence                        ║
  ║                                                                           ║
  ║  SA FLAG COLORS: Green #007A4D, Yellow #FFB612, Red #DE3831,              ║
  ║                  Blue #002395, Black #000000, White #FFFFFF               ║
  ║                                                                           ║
  ╚═══════════════════════════════════════════════════════════════════════════╝
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="80" height="80" viewBox="0 0 80 80"
     style="display:block; background:transparent;"
     role="img" aria-label="Gogga is creating your icon">
  <defs>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="iconShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: ROTATING ICON FRAME - The container being built                -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(40,40)">
    <!-- Outer rotating square frame -->
    <rect x="-28" y="-28" width="56" height="56" rx="12" fill="none" 
          stroke="#007A4D" stroke-width="2" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" 
                        from="0" to="90" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke" dur="2s" repeatCount="indefinite"
               values="#007A4D;#FFB612;#DE3831;#002395;#007A4D"/>
    </rect>
    
    <!-- Inner counter-rotating frame -->
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="none" 
          stroke="#FFB612" stroke-width="1.5" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" 
                        from="0" to="-90" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke" dur="2s" repeatCount="indefinite"
               values="#FFB612;#DE3831;#002395;#007A4D;#FFB612"/>
    </rect>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: MORPHING ICON SHAPES - Abstract icon elements appearing        -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(40,40)">
    <!-- Shape 1: Circle morphing to rounded square -->
    <rect x="-12" y="-12" width="24" height="24" fill="#007A4D" filter="url(#iconGlow)">
      <animate attributeName="rx" dur="1.5s" repeatCount="indefinite" 
               values="12;4;12" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="ry" dur="1.5s" repeatCount="indefinite" 
               values="12;4;12" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="fill" dur="3s" repeatCount="indefinite"
               values="#007A4D;#FFB612;#DE3831;#002395;#007A4D"/>
      <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="0.8;1;0.8"/>
    </rect>
    
    <!-- Shine overlay -->
    <rect x="-12" y="-12" width="24" height="24" fill="url(#iconShine)" opacity="0.6">
      <animate attributeName="rx" dur="1.5s" repeatCount="indefinite" 
               values="12;4;12" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="ry" dur="1.5s" repeatCount="indefinite" 
               values="12;4;12" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </rect>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: CORNER DOTS - Building blocks flying in                        -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(40,40)">
    <!-- Top-left dot -->
    <circle r="4" fill="#007A4D" filter="url(#iconGlow)">
      <animate attributeName="cx" dur="0.75s" repeatCount="indefinite" 
               values="-30;-18;-30" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="cy" dur="0.75s" repeatCount="indefinite" 
               values="-30;-18;-30" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="r" dur="0.75s" repeatCount="indefinite" values="3;5;3"/>
      <animate attributeName="opacity" dur="0.75s" repeatCount="indefinite" values="0.4;1;0.4"/>
    </circle>
    
    <!-- Top-right dot -->
    <circle r="4" fill="#FFB612" filter="url(#iconGlow)">
      <animate attributeName="cx" dur="0.75s" repeatCount="indefinite" 
               values="30;18;30" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" begin="0.1875s"/>
      <animate attributeName="cy" dur="0.75s" repeatCount="indefinite" 
               values="-30;-18;-30" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" begin="0.1875s"/>
      <animate attributeName="r" dur="0.75s" repeatCount="indefinite" values="3;5;3" begin="0.1875s"/>
      <animate attributeName="opacity" dur="0.75s" repeatCount="indefinite" values="0.4;1;0.4" begin="0.1875s"/>
    </circle>
    
    <!-- Bottom-right dot -->
    <circle r="4" fill="#DE3831" filter="url(#iconGlow)">
      <animate attributeName="cx" dur="0.75s" repeatCount="indefinite" 
               values="30;18;30" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" begin="0.375s"/>
      <animate attributeName="cy" dur="0.75s" repeatCount="indefinite" 
               values="30;18;30" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" begin="0.375s"/>
      <animate attributeName="r" dur="0.75s" repeatCount="indefinite" values="3;5;3" begin="0.375s"/>
      <animate attributeName="opacity" dur="0.75s" repeatCount="indefinite" values="0.4;1;0.4" begin="0.375s"/>
    </circle>
    
    <!-- Bottom-left dot -->
    <circle r="4" fill="#002395" filter="url(#iconGlow)">
      <animate attributeName="cx" dur="0.75s" repeatCount="indefinite" 
               values="-30;-18;-30" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" begin="0.5625s"/>
      <animate attributeName="cy" dur="0.75s" repeatCount="indefinite" 
               values="30;18;30" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" begin="0.5625s"/>
      <animate attributeName="r" dur="0.75s" repeatCount="indefinite" values="3;5;3" begin="0.5625s"/>
      <animate attributeName="opacity" dur="0.75s" repeatCount="indefinite" values="0.4;1;0.4" begin="0.5625s"/>
    </circle>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 4: PIXEL GRID FLASH - Quick grid pattern                          -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(40,40)" opacity="0.5">
    <!-- 3x3 mini pixel grid that pulses -->
    <rect x="-8" y="-8" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0"/>
    </rect>
    <rect x="-2" y="-8" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0" begin="0.055s"/>
    </rect>
    <rect x="4" y="-8" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0" begin="0.111s"/>
    </rect>
    <rect x="-8" y="-2" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0" begin="0.166s"/>
    </rect>
    <rect x="-2" y="-2" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0" begin="0.222s"/>
    </rect>
    <rect x="4" y="-2" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0" begin="0.277s"/>
    </rect>
    <rect x="-8" y="4" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0" begin="0.333s"/>
    </rect>
    <rect x="-2" y="4" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0" begin="0.388s"/>
    </rect>
    <rect x="4" y="4" width="4" height="4" fill="#ffffff">
      <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0;0.8;0" begin="0.444s"/>
    </rect>
  </g>

</svg>
